[project]
name = "dmrv-agentic-validation-poc"
version = "0.1.0"
description = "Agentic dMRV data validation PoC"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "duckdb",
    "pydantic>=2",
    "pandas",
    "shapely",
    "pyproj",
    "pyyaml",
    "python-dateutil",
    "pytest",
    "anthropic",
    "python-dotenv",
    "pytz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "validation", "agents", "adapters", "persistence"]
