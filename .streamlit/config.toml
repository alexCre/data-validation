# App-wide visual theme. Shared typography/density here; per-mode colors
# in [theme.light]/[theme.dark] so the built-in Settings > light/dark
# toggle still works (validation/app/components/charts.py's _theme_ink()
# already branches on theme.base to match chart ink/grid to whichever is
# active).
#
# Font: Inter, loaded from Google Fonts (free, open-source) - a close
# match for Proxima Nova's look without needing a licensed font file.
# Swap the URL below for a self-hosted [[theme.fontFaces]] entry if a
# licensed Proxima Nova file becomes available.
[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, -apple-system, Helvetica Neue, Arial, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, -apple-system, Helvetica Neue, Arial, sans-serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem", "0.95rem", "0.875rem", "0.8rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 700
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
codeFontSize = "0.8rem"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f4f0"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f5f4f0"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#111111"
secondaryBackgroundColor = "#1c1c1a"
textColor = "#ffffff"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
dataframeHeaderBackgroundColor = "#1c1c1a"
