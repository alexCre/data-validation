# App-wide visual theme. Shared typography/density here; per-mode colors
# in [theme.light]/[theme.dark] so the built-in Settings > light/dark
# toggle still works (validation/app/components/charts.py's _theme_ink()
# already branches on theme.base to match chart ink/grid to whichever is
# active).
#
# Font: Inter (SIL OFL), self-hosted from app/static/ so the app renders
# identically with no internet (venue wifi, air-gapped demo). A variable
# font: one file covers every weight. Swap the [[theme.fontFaces]] entry
# for a licensed file (e.g. Proxima Nova) if one becomes available.
[server]
enableStaticServing = true

[theme]
base = "light"
font = "Inter, -apple-system, Helvetica Neue, Arial, sans-serif"
headingFont = "Inter, -apple-system, Helvetica Neue, Arial, sans-serif"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["1.85rem", "1.3rem", "1.1rem", "0.95rem", "0.875rem", "0.8rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
showWidgetBorder = true

codeFontSize = "0.8rem"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#e4e8ee"
dataframeBorderColor = "#e4e8ee"
dataframeHeaderBackgroundColor = "#f1f5f9"
codeTextColor = "#334155"
codeBackgroundColor = "#eef2f7"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#111111"
secondaryBackgroundColor = "#1c1c1a"
textColor = "#ffffff"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
dataframeHeaderBackgroundColor = "#1c1c1a"
